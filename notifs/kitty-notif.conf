# Dedicated kitty window for kittyproto notification toasts.
# Hyprland owns the outer border/rounding/shadow/animation.
font_size 12.0
background #101318
foreground #d8dee9
background_opacity 0.94
window_padding_width 1
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
initial_window_width 46c
initial_window_height 7c
cursor_shape block
cursor_blink_interval 0
