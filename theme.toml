[hyprland]
# Keep the bar visually synced to the running Hyprland theme.
sync_border_colors = false
sync_border_angle = false
sync_border_width = false
sync_rounding = false

[bar]
# Physical panel height. Kitty's panel kitten accepts pixel heights directly.
height_px = 30

# Panel position around the visible bar. Kittyproto owns the top and side
# margins; Hyprland gaps_out owns the space below the reserved bar area.
top_gap_px = 8
side_gap_px = 8

# The terminal surface itself is transparent; the rounded chrome image supplies
# the visible background so the corners can actually be transparent.
background = "#101318"
background_opacity = 0.80

# Inner terminal padding. Kitty measures this in points.
gaps_in_pt = 0

# Used only when sync_rounding = false.
radius_px = 10

# Prefix keeps workspace 1 clear of the rounded left corner. Nerd Fonts uses
# U+F303 for the Arch logo; replace this with any text/glyph you prefer.
left_prefix = "   "

# Keep the clock away from the rounded right corner.
right_padding_cells = 2

clock_interval_seconds = 1.0
clock_format = "%a %b %d %I:%M%p"

[text]
# Affects only this kitty panel, not normal kitty windows.
size = 14.0
foreground = "#d8dee9"
muted = "#687080"

[border]
enabled = true

# Used only when sync_border_width = false.
width_px = 2

# Used if Hyprland color parsing fails or sync_border_colors = false.
fallback_colors = ["#33ccff", "#00ff99"]

# Used only when sync_border_angle = false.
angle_deg = 75.0

[workspaces]
minimum = 2

# Workspace label style:
#   "numbers"     = 1 2 3
#   "circles"     = ○ ● ○
#   "squares"     = □ ■ □
#   "underscores" = _ _ _
display = "numbers"

# Glyphs used by the symbolic display modes.
circle_inactive = "○"
circle_active = "●"
square_inactive = "□"
square_active = "■"
underscore_inactive = "_"
underscore_active = "_"

# Active workspace highlight style:
#   "background" = active cell gets a colored background
#   "foreground" = only the active label/glyph changes color
active_style = "foreground"

# Visible padding inside each workspace cell. 0 keeps the row compact.
padding_cells = 0

# Blank cells between workspace indicators.
gap_cells = 1

active_foreground = "#101318"
active_background = "#33ccff"
active_color = "#33ccff"
inactive_foreground = "#c7ccd6"

# When true, use Hyprland's active border color as the workspace accent.
# In background mode it replaces active_background; in foreground mode it
# replaces active_color.
use_border_color_for_active = true

[media]
# Space between the workspace cluster and now-playing.
gap_cells = 2

# Extra blank cells owned by the now-playing mouse region.
click_padding_cells = 0

# Direct MPD backend. The bar listens to MPD's `idle player` event, so song
# changes and play/pause state update immediately without a polling loop.
# Leave socket empty to use $XDG_RUNTIME_DIR/mpd/socket.
enabled = true
backend = "mpd"
socket = ""
reconnect_seconds = 2.0

# Used only if backend = "mpris".
player = ""
interval_seconds = 0.5

max_length = 64
separator = "   "
foreground = "#d8dee9"

[volume]
enabled = true

# Blank cells on each side are part of the clickable/scrollable volume region.
click_padding_cells = 1
target = "@DEFAULT_AUDIO_SINK@"
scroll_step_percent = 5
# Used only if neither pactl subscribe nor pw-mon is available.
fallback_interval_seconds = 0.5
separator = "   "
foreground = "#d8dee9"
low_icon = "󰕿"
medium_icon = "󰖀"
high_icon = "󰕾"
muted_icon = "󰖁"

[status]
# Visible spacing between Volume / Wi-Fi / Bluetooth. Their click padding is
# separate, so this can stay at 0 while the mouse hitboxes remain generous.
gap_cells = 0

# Extra spacing before the non-clickable clock.
clock_gap_cells = 1

# Wi-Fi/Bluetooth state is intentionally lightweight. These are not latency-
# sensitive controls, so they refresh periodically rather than running more
# long-lived monitor processes.
interval_seconds = 2.0

[network]
enabled = true
click_padding_cells = 1
connected_icon = "󰤨"
disconnected_icon = "󰤯"
off_icon = "󰤭"
foreground = "#d8dee9"
muted_foreground = "#687080"
# Opens a normal kitty terminal for NetworkManager's TUI.
click_command = ["kitty", "nmtui"]

[bluetooth]
enabled = true
click_padding_cells = 1
on_icon = "󰂯"
off_icon = "󰂲"
foreground = "#d8dee9"
muted_foreground = "#687080"
click_command = ["blueman-manager"]
