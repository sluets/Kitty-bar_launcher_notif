# Static kitty settings used only by kitty-desktop.
# Runtime appearance settings are supplied by launch.py from theme.toml.
# Font family intentionally inherits your normal kitty configuration.

confirm_os_window_close 0
enable_audio_bell no
cursor_trail 0
scrollback_lines 0
tab_bar_style hidden

# Keep unavoidable terminal-cell remainder balanced around the text grid.
# The full OS-panel chrome is now a kitty background image, so these remainder
# pixels no longer become transparent gaps around the visible bar.
placement_strategy center

draw_window_borders_for_single_window no
draw_minimal_borders yes
