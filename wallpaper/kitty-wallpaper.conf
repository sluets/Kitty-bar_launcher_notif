# Dedicated normal kitty OS window for kittyproto wallpaper picker.
# Hyprland supplies the native outer border/rounding/shadow/animation.
font_size 11.0
background #101318
foreground #d8dee9
background_opacity 0.94
cursor #33ccff
cursor_text_color #101318
selection_background #33ccff
selection_foreground #101318
window_padding_width 0
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
# start-wallpaper.sh calculates the exact cell geometry from wallpaper.toml.
