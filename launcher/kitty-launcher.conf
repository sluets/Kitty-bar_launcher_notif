# Dedicated normal kitty OS window for kittyproto launcher.
# Hyprland provides the native outer border, rounding, shadow and animation.
font_size 14.0
background #101318
foreground #d8dee9
background_opacity 0.92
cursor #33ccff
cursor_text_color #101318
selection_background #33ccff
selection_foreground #101318
window_padding_width 0
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
initial_window_width 64c
initial_window_height 13c
