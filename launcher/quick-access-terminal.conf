# Kitty quick-access surface dedicated to kittyproto's launcher.
edge center-sized
layer overlay
columns 64
lines 15
background_opacity 0
hide_on_focus_loss no
focus_policy exclusive
app_id kittyproto-launcher

# Keep this surface visually close to the top bar. launcher.py handles the
# inner border/search/list colors; these control kitty's terminal itself.
kitty_override background=#000000
kitty_override foreground=#d8dee9
kitty_override cursor=#33ccff
kitty_override cursor_text_color=#101318
kitty_override selection_background=#33ccff
kitty_override selection_foreground=#101318
kitty_override window_padding_width=0
kitty_override font_size=14.0
kitty_override confirm_os_window_close=0
kitty_override enable_audio_bell=no
